artifacts:
  - path: src/main/kotlin/com/fito/cases/jsonendpoint/App.kt
    role: target
    description: "Application routes and handlers for the users service and requested health endpoint."
  - path: src/test/kotlin/com/fito/cases/jsonendpoint/AppTest.kt
    role: evidence
    description: "Existing users behavior tests; health-response checks will be added during source work."
  - path: build.gradle.kts
    role: scaffold
    description: "Kotlin/Javalin dependencies and the project's test configuration."
  - path: README.md
    role: reference
    description: "Project overview and test command."
